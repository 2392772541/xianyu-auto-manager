<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>闲鱼素材下载器</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f5f0;color:#202920;font:16px/1.6 system-ui}main{max-width:1120px;margin:auto;padding:40px 24px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}h1{font-size:32px;margin:0}p{color:#626b62}small{color:#677167}button,a.btn{border:0;border-radius:10px;padding:12px 18px;background:#204d38;color:white;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#e5ebe5;color:#204d38}button:disabled{opacity:.5;cursor:wait}.panel,article{background:white;border:1px solid #e0e5dd;border-radius:18px;padding:24px;margin-top:24px}textarea{width:100%;resize:vertical;min-height:105px;border:1px solid #bfcbbc;border-radius:10px;padding:15px;font:inherit}.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}#notice{color:#a23b19;min-height:26px}h2{margin:0;font-size:20px}.status{font-size:14px;background:#edf2ed;border-radius:20px;padding:5px 12px;display:inline-block}.images{display:flex;gap:12px;overflow:auto;margin:16px 0}.images img{height:170px;max-width:220px;object-fit:contain;background:#f4f4f0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.8 system-ui;background:#f7f8f4;padding:16px;border-radius:10px;max-height:280px;overflow:auto}.path{font-size:13px;overflow-wrap:anywhere}article h2{overflow-wrap:anywhere}#empty{padding:40px;text-align:center;color:#758075}@media(max-width:600px){header{display:block}h1{font-size:26px}main{padding:24px 15px}.panel,article{padding:18px}header button{margin-top:12px}}</style>
<main><header><div><small>本地保存 · 原文与商品图</small><h1>闲鱼素材下载器</h1></div><button class="secondary" id="login">打开闲鱼 / 登录</button></header>
<section class="panel"><h2>粘贴商品链接</h2><p>支持闲鱼网页版商品长链接，每行一条，最多 20 条。首次使用请在采集浏览器完成登录。</p><textarea id="links" aria-label="商品链接" placeholder="https://www.goofish.com/item?id=..."></textarea><div class="bar"><button id="start">开始提取并保存</button><small>文案 TXT + 全套图片 + 来源 JSON + ZIP</small></div><div id="notice" role="status"></div></section>
<details class="panel"><summary>已登录浏览器备用采集入口</summary><p>将下方“采集当前商品”拖到浏览器书签栏。在闲鱼商品页面展开文案后，点击此书签即可带回资料。只读取当前商品，不读取登录凭据。</p><a class="btn" id="bookmark">采集当前商品</a><p>也可粘贴已提取的商品 JSON：</p><textarea id="importData" aria-label="商品JSON" placeholder="包含 url、id、description、images 的商品资料"></textarea><button id="importButton">导入并下载图片</button></details>
<div class="bar"><h2>下载任务</h2><span id="summary"></span></div><p class="path" id="output"></p><section id="jobs"><div id="empty">添加一件商品，开始保存素材。</div></section></main>
<script>
const $=s=>document.querySelector(s);let fingerprint='';
async function post(url,body={}){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}
async function action(fn){$('#notice').textContent='';try{await fn();await refresh();}catch(e){$('#notice').textContent=e.message;}}
$('#login').onclick=()=>action(async()=>{await post('/api/login');$('#notice').textContent='请在打开的闲鱼窗口登录，再提交商品链接。'});
$('#start').onclick=()=>action(async()=>{const d=await post('/api/add',{text:$('#links').value});$('#notice').textContent=d.added?`已加入 ${d.added} 个任务`:'这些商品已有任务，无需重复添加。';});
$('#importButton').onclick=()=>action(async()=>{await post('/api/import',{product:JSON.parse($('#importData').value)});$('#notice').textContent='已导入，正在下载图片';});
fetch('/api/bookmarklet').then(r=>r.json()).then(d=>$('#bookmark').href=d.url);
if(location.hash.startsWith('#import=')){try{$('#importData').value=decodeURIComponent(location.hash.slice(8));$('details').open=true;history.replaceState(null,'',location.pathname);$('#notice').textContent='商品资料已载入，点击“导入并下载图片”保存。';}catch{}}
const labels={queued:'排队中',running:'采集中',done:'完整下载',partial:'待核对',failed:'未完成'};
function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;}
async function refresh(){const r=await fetch('/api/jobs');const d=await r.json();$('#output').textContent='保存位置：'+d.output;$('#summary').textContent=`共 ${d.jobs.length} 个 · ${d.busy?'正在处理':'就绪'}`;$('#login').disabled=d.busy;
const fp=JSON.stringify(d.jobs);if(fp===fingerprint)return;fingerprint=fp;if(!d.jobs.length)return;$('#jobs').replaceChildren();
for(const j of [...d.jobs].reverse()){const card=element('article');card.append(element('h2',j.title||'商品 '+j.id));const s=element('span',labels[j.state]+' · '+j.message);s.className='status';card.append(s);
if(j.images){const imgs=element('div');imgs.className='images';j.images.forEach((im,i)=>{const image=element('img');image.src=`/image?job=${j.key}&n=${i}`;image.alt=`商品图 ${im.position} · ${im.width}×${im.height}`;image.title=image.alt;imgs.append(image);});card.append(imgs);card.append(element('pre',j.description));}
const bar=element('div');bar.className='bar';if(j.dir){const a=element('a','下载 ZIP');a.className='btn';a.href='/zip?job='+j.key;bar.append(a);const b=element('button','打开文件夹');b.className='secondary';b.onclick=()=>action(()=>post('/api/open',{key:j.key}));bar.append(b);const c=element('button','复制文案');c.className='secondary';c.onclick=()=>action(async()=>{await navigator.clipboard.writeText(j.description);$('#notice').textContent='文案已复制';});bar.append(c);}
if(['failed','partial'].includes(j.state)){const b=element('button','重试（另存版本）');b.onclick=()=>action(()=>post('/api/retry',{key:j.key}));bar.append(b);}card.append(bar);$('#jobs').append(card);}}
refresh().catch(e=>$('#notice').textContent=e.message);setInterval(()=>refresh().catch(()=>$('#notice').textContent='服务未连接，请重新启动下载器'),1500);
</script></html>
